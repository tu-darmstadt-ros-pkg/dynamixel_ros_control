/**:

  controller_manager:
    ros__parameters:
      update_rate: 50 # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      # Flipper Controllers
      flipper_position_controller:
        type: forward_command_controller/ForwardCommandController
      flipper_velocity_controller:
        type: forward_command_controller/ForwardCommandController
      flipper_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      # Arm Controllers
      arm_position_controller:
        type: forward_command_controller/ForwardCommandController
      arm_velocity_controller:
        type: forward_command_controller/ForwardCommandController
      arm_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController
      # Drives the flippers in CURRENT mode. The generic forward controller, because no
      # current_controllers/JointGroupCurrentController exists and effort_controllers claims the
      # "effort" interface, which these joints do not expose.
      flipper_current_controller:
        type: forward_command_controller/ForwardCommandController

      # Torque off claims. The forward controller writes nothing until it gets a command, and the
      # claim alone makes the joints limp.
      arm_torque_off_controller:
        type: forward_command_controller/ForwardCommandController
      arm_joints_torque_off_controller:
        type: forward_command_controller/ForwardCommandController
      flipper_torque_off_controller:
        type: forward_command_controller/ForwardCommandController
      gripper_torque_off_controller:
        type: forward_command_controller/ForwardCommandController

      # Gripper Controllers
      gripper_position_controller:
        type: forward_command_controller/ForwardCommandController
      gripper_trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

  # --- Joint State Broadcaster ---
  joint_state_broadcaster:
    ros__parameters: {}

  # --- Flipper Configurations ---
  flipper_position_controller:
    ros__parameters:
      interface_name: position
      joints:
        - flipper_fl_joint
        - flipper_fr_joint
        - flipper_bl_joint
        - flipper_br_joint

  flipper_velocity_controller:
    ros__parameters:
      interface_name: velocity
      joints:
        - flipper_fl_joint
        - flipper_fr_joint
        - flipper_bl_joint
        - flipper_br_joint

  flipper_trajectory_controller:
    ros__parameters:
      joints:
        - flipper_fl_joint
        - flipper_fr_joint
        - flipper_bl_joint
        - flipper_br_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity

  # --- Arm Configurations ---
  arm_position_controller:
    ros__parameters:
      interface_name: position
      joints:
        - arm_joint_1
        - arm_joint_2
        - arm_joint_3
        - arm_joint_4
        - arm_joint_5
        - arm_joint_6
        - arm_joint_7

  arm_velocity_controller:
    ros__parameters:
      interface_name: velocity
      joints:
        - arm_joint_1
        - arm_joint_2
        - arm_joint_3
        - arm_joint_4
        - arm_joint_5
        - arm_joint_6
        - arm_joint_7

  arm_trajectory_controller:
    ros__parameters:
      joints:
        - arm_joint_1
        - arm_joint_2
        - arm_joint_3
        - arm_joint_4
        - arm_joint_5
        - arm_joint_6
        - arm_joint_7
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity

  flipper_current_controller:
    ros__parameters:
      interface_name: current
      joints:
        - flipper_fl_joint
        - flipper_fr_joint
        - flipper_bl_joint
        - flipper_br_joint

  # --- Torque Off Configurations ---
  arm_torque_off_controller:
    ros__parameters:
      interface_name: torque_off
      joints:
        - arm_joint_1
        - arm_joint_2
        - arm_joint_3
        - arm_joint_4
        - arm_joint_5
        - arm_joint_6
        - arm_joint_7
        - gripper_servo_joint

  arm_joints_torque_off_controller:
    ros__parameters:
      interface_name: torque_off
      joints:
        - arm_joint_1
        - arm_joint_2
        - arm_joint_3
        - arm_joint_4
        - arm_joint_5
        - arm_joint_6
        - arm_joint_7

  gripper_torque_off_controller:
    ros__parameters:
      interface_name: torque_off
      joints:
        - gripper_servo_joint

  flipper_torque_off_controller:
    ros__parameters:
      interface_name: torque_off
      joints:
        - flipper_fl_joint
        - flipper_fr_joint
        - flipper_bl_joint
        - flipper_br_joint

  # --- Gripper Configurations ---
  gripper_position_controller:
    ros__parameters:
      interface_name: position
      joints:
        - gripper_servo_joint

  gripper_trajectory_controller:
    ros__parameters:
      joints:
        - gripper_servo_joint
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
