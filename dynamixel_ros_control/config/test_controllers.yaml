/**:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      velocity_controller:
        type: forward_command_controller/ForwardCommandController

      position_controller:
        type: forward_command_controller/ForwardCommandController

      trajectory_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      multi_interface_controller:
        type: forward_command_controller/MultiInterfaceForwardCommandController


  multi_interface_controller:
    ros__parameters:
      joint: joint_1
      # max_current needs a model that limits by Goal Current in extended_position, e.g. P series
      interface_names:
        - position
        - max_current


  velocity_controller:
    ros__parameters:
      interface_name: velocity
      joints:
        - joint_1

  position_controller:
    ros__parameters:
      interface_name: position
      joints:
        - joint_1

  trajectory_controller:
    ros__parameters:
      joints:
        - joint_1

      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
